services:
  api:
    build: .
    ports: [ "8000:8000" ]
    environment:
      DATABASE_URL: >-
        postgresql+psycopg://velov:${POSTGRES_PASSWORD:?}@db:5432/velov
      MODEL_DIR: /app/models
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: velov
      POSTGRES_USER: velov
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes: [ pgdata:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U velov -d velov" ]
    restart: unless-stopped

volumes:
  pgdata:
